# Publish the repository root as a static site.
#
# The legacy Pages builder failed here without a usable log. This repo is plain
# static files — index.html plus the CSV/JSON/PNG artifacts it links — so the
# upload-pages-artifact path is both the right tool and the one that reports
# what went wrong when it does.
name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it midway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5

      # Stage only what the site actually serves. Uploading the repo root sent a
      # ~58 MB artifact, over half of which was data/labels — 40 MB of blind
      # labelling sheets that the page links to on github.com by absolute URL and
      # never fetches from Pages. Publishing took longer than deploy-pages waits,
      # so the action cancelled its own deployment mid-publish. Everything below
      # is referenced by a relative href/src in index.html, or by site_index.json.
      - name: Stage site
        run: |
          mkdir -p _site
          cp index.html .nojekyll _site/
          mkdir -p _site/data
          cp data/*.csv data/site_index.json _site/data/
          cp -r figures _site/figures
          du -sh _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 1800000
